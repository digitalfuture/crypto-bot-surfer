# docker-compose.yml

version: "3.9"

# Basic service template
x-template: &basic-container
  image: node:20
  volumes:
    - /home/koshkindom/app/report:/home/report
  env_file: .env
  working_dir: /home
  command:
    - bash
    - -c
    - |
      rm -rf crypto-bot-surfer && \
      git clone --branch signal-trading https://github.com/digitalfuture/crypto-bot-surfer.git && \
      cd crypto-bot-surfer && \
      npm install && \
      npm run nodemon

# Creating containers
services:
  # # # # # # # # # # # # # # # # # # # # # # # # # # #

  signals--1h:
    container_name: crypto-bot-surfer-external
    <<: *basic-container
    environment:
      - INDICATOR=external
      - HEARTBEAT_INTERVAL=1h
      - NEXT_TRADE_DELAY=1h
      - REPORT_FILE_DIR=/home/report
      - REPORT_FILE_NAME=signals-01h.csv

  dump--05m:
    container_name: crypto-bot-surfer-1
    <<: *basic-container
    environment:
      - INDICATOR=dump
      - HEARTBEAT_INTERVAL=05m
      - NEXT_TRADE_DELAY=05m
      - REPORT_FILE_DIR=/home/report
      - REPORT_FILE_NAME=dump-05m.csv

  dump--08m:
    container_name: crypto-bot-surfer-2
    <<: *basic-container
    environment:
      - INDICATOR=dump
      - HEARTBEAT_INTERVAL=08m
      - NEXT_TRADE_DELAY=08m
      - REPORT_FILE_DIR=/home/report
      - REPORT_FILE_NAME=dump-08m.csv

  dump--11m:
