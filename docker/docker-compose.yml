# docker-compose.yml

# Basic service template
x-template: &basic-container
  image: node:20
  volumes:
    - /home/report:/home/report
  env_file: .env
  working_dir: /home
  command:
    - bash
    - -c
    - |
      rm -rf crypto-bot-surfer && \
      git clone --branch signal-trading https://github.com/digitalfuture/crypto-bot-surfer.git && \
      cd crypto-bot-surfer && \
      npm install && \
      npm run nodemon

services:
  # # # # # # # # # # # # # # # # # # # # # # # # # # #

  crypto-bot-surfer-1:
    container_name: crypto-bot-surfer-1
    <<: *basic-container
    environment:
      - INDICATOR=psar
      - HEARTBEAT_INTERVAL=15m
      - PRIMARY_SYMBOL=BTC
      - BACKTEST_PERIODS=500
      - NEXT_TRADE_DELAY=01m
      - REPORT_FILE_DIR=/home/report
      - REPORT_FILE_NAME=psar-fast-15m-BTC.csv

  crypto-bot-surfer-2:
