# docker-compose.yml

# Basic service template
x-template: &basic-container
  image: node:20
  volumes:
    - /home/report:/home/report
  env_file: .env
  working_dir: /home
  command:
    - bash
    - -c
    - |
      rm -rf crypto-bot-surfer && \
      git clone --branch short-stop-loss-take-profit https://github.com/digitalfuture/crypto-bot-surfer.git && \
      cd crypto-bot-surfer && \
      npm install && \
      if [ "$TEST_MODE" = "false" ]; then \
        echo "Installing pm2 and pm2-logrotate..." && \
        npm install -g pm2 pm2-logrotate && \
        echo "Configuring pm2-logrotate..." && \
        pm2 install pm2-logrotate && \
        pm2 set pm2-logrotate:max_size 10M && \
        pm2 set pm2-logrotate:retain 3 && \
        pm2 set pm2-logrotate:compress true && \
        pm2 set pm2-logrotate:dateFormat YYYY-MM-DD_HH-mm-ss && \
        echo "Starting in PRODUCTION mode with pm2..." && \
        npm run build && \
        pm2 start dist/index.js --name crypto-bot && \
        pm2 logs --lines 1000 --nostream; \
      else \
        echo "Starting in TEST mode with nodemon..." && \
        npm run nodemon; \
      fi
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  crypto-bot-surfer-1:
    container_name: crypto-bot-surfer-1
    <<: *basic-container
    environment:
      - SYSTEM_PARAM_3=0
      - REPORT_FILE_DIR=/home/report
      - REPORT_FILE_NAME=volatility-1m-1.csv

