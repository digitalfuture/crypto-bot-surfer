# docker-compose.yml

# Basic service template
x-template: &basic-container
  image: node:20
  volumes:
    - /home/report:/home/report
  env_file: .env
  working_dir: /home
  command:
    - bash
    - -c
    - |
      rm -rf crypto-bot-surfer && \
      git clone --branch signal-trading https://github.com/digitalfuture/crypto-bot-surfer.git && \
      cd crypto-bot-surfer && \
      npm install && \
      npm run nodemon

services:
  # # # # # # # # # # # # # # # # # # # # # # # # # # #

  crypto-bot-surfer-1:
    container_name: crypto-bot-surfer-1
    <<: *basic-container
    environment:
      - SYSTEM_PARAM_1=10
      - SYSTEM_PARAM_2=DOWN
      - REPORT_FILE_DIR=/home/report
      - REPORT_FILE_NAME=pump-15m-DOWN-10.csv

  crypto-bot-surfer-2:
    container_name: crypto-bot-surfer-2
    <<: *basic-container
    environment:
      - SYSTEM_PARAM_1=20
      - SYSTEM_PARAM_2=DOWN
      - REPORT_FILE_DIR=/home/report
      - REPORT_FILE_NAME=pump-15m-DOWN-22.csv

  crypto-bot-surfer-3:
    container_name: crypto-bot-surfer-3
    <<: *basic-container
    environment:
      - SYSTEM_PARAM_1=30
      - SYSTEM_PARAM_2=DOWN
      - REPORT_FILE_DIR=/home/report
      - REPORT_FILE_NAME=pump-15m-DOWN-30.csv

  crypto-bot-surfer-4:
    container_name: crypto-bot-surfer-4
    <<: *basic-container
    environment:
      - SYSTEM_PARAM_1=40
      - SYSTEM_PARAM_2=DOWN
      - REPORT_FILE_DIR=/home/report
      - REPORT_FILE_NAME=pump-15m-DOWN-40.csv

  crypto-bot-surfer-5:
    container_name: crypto-bot-surfer-5
    <<: *basic-container
    environment:
      - SYSTEM_PARAM_1=50
      - SYSTEM_PARAM_2=DOWN
      - REPORT_FILE_DIR=/home/report
      - REPORT_FILE_NAME=pump-15m-DOWN-50.csv

  crypto-bot-surfer-6:
