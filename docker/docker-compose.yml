# docker-compose.yml

# Basic service template
x-template: &basic-container
  image: node:20
  volumes:
    - /home/report:/home/report
  env_file: .env
  working_dir: /home
  command:
    - bash
    - -c
    - |
      rm -rf crypto-bot-surfer && \
      git clone --branch signal-trading https://github.com/digitalfuture/crypto-bot-surfer.git && \
      cd crypto-bot-surfer && \
      npm install && \
      npm run nodemon

# Creating containers
services:
  # # # # # # # # # # # # # # # # # # # # # # # # # # #

  pump--5m-fast:
    container_name: crypto-bot-surfer-1
    <<: *basic-container
    environment:
      - INDICATOR=pump
      - HEARTBEAT_INTERVAL=5m
      - NEXT_TRADE_DELAY=01m
      - REPORT_FILE_DIR=/home/report
      - REPORT_FILE_NAME=pump-fast-05m.csv

  pump--10m-fast:
    container_name: crypto-bot-surfer-2
    <<: *basic-container
    environment:
      - INDICATOR=pump
      - HEARTBEAT_INTERVAL=10m
      - NEXT_TRADE_DELAY=01m
      - REPORT_FILE_DIR=/home/report
      - REPORT_FILE_NAME=pump-fast-10m.csv

  pump--15m-fast:
    container_name: crypto-bot-surfer-3
    <<: *basic-container
    environment:
      - INDICATOR=pump
      - HEARTBEAT_INTERVAL=15m
      - NEXT_TRADE_DELAY=01m
      - REPORT_FILE_DIR=/home/report
      - REPORT_FILE_NAME=pump-fast-15m.csv

  pump--20m-fast:
    container_name: crypto-bot-surfer-4
    <<: *basic-container
    environment:
      - INDICATOR=pump
      - HEARTBEAT_INTERVAL=20m
      - NEXT_TRADE_DELAY=01m
      - REPORT_FILE_DIR=/home/report
      - REPORT_FILE_NAME=pump-fast-20m.csv
