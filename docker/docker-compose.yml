# docker-compose.yml

# Basic service template
x-template: &basic-container
  image: node:20
  volumes:
    - /home/report:/home/report
  env_file: .env
  working_dir: /home
  command:
    - bash
    - -c
    - |
      rm -rf crypto-bot-surfer && \
      git clone --branch signal-trading https://github.com/digitalfuture/crypto-bot-surfer.git && \
      cd crypto-bot-surfer && \
      npm install && \
      npm run nodemon

services:
  # # # # # # # # # # # # # # # # # # # # # # # # # # #

  crypto-bot-surfer-1:
    container_name: crypto-bot-surfer-1
    <<: *basic-container
    environment:
      - INDICATOR=psar
      - PRIMARY_SYMBOL=BTC
      - REPORT_FILE_DIR=/home/report
      - REPORT_FILE_NAME=psar-BTC.csv

  crypto-bot-surfer-2:
    container_name: crypto-bot-surfer-2
    <<: *basic-container
    environment:
      - INDICATOR=psar
      - PRIMARY_SYMBOL=BNB
      - REPORT_FILE_DIR=/home/report
      - REPORT_FILE_NAME=psar-fast-BNB.csv

  crypto-bot-surfer-3:
    container_name: crypto-bot-surfer-3
    <<: *basic-container
    environment:
      - INDICATOR=psar
      - PRIMARY_SYMBOL=XRP
      - REPORT_FILE_DIR=/home/report
      - REPORT_FILE_NAME=psar-XRP.csv

  crypto-bot-surfer-4:
    container_name: crypto-bot-surfer-4
    <<: *basic-container
    environment:
      - INDICATOR=psar
      - PRIMARY_SYMBOL=DOGE
      - REPORT_FILE_DIR=/home/report
      - REPORT_FILE_NAME=psar-DOGE.csv

  crypto-bot-surfer-5:
    container_name: crypto-bot-surfer-5
    <<: *basic-container
    environment:
      - INDICATOR=double-ema
      - PRIMARY_SYMBOL=BTC
      - REPORT_FILE_DIR=/home/report
      - REPORT_FILE_NAME=double-ema-BTC.csv

  crypto-bot-surfer-6:
    container_name: crypto-bot-surfer-6
    <<: *basic-container
    environment:
      - INDICATOR=volume-momentum
      - PRIMARY_SYMBOL=BTC
      - REPORT_FILE_DIR=/home/report
      - REPORT_FILE_NAME=volume-momentum-BTC.csv

  crypto-bot-surfer-7:
    container_name: crypto-bot-surfer-7
    <<: *basic-container
    environment:
      - INDICATOR=pump
      - REPORT_FILE_DIR=/home/report
      - REPORT_FILE_NAME=pump-random-1.csv

  crypto-bot-surfer-8:
    container_name: crypto-bot-surfer-8
    <<: *basic-container
    environment:
      - INDICATOR=pump
      - REPORT_FILE_DIR=/home/report
      - REPORT_FILE_NAME=pump-random-2.csv
