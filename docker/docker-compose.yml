      - SYSTEM_PARAM_1=70
      - SYSTEM_PARAM_2=UP
      - REPORT_FILE_DIR=/home/report
      - REPORT_FILE_NAME=pump-15m-UP-70.csv

  crypto-bot-surfer-7:
    container_name: crypto-bot-surfer-7
    <<: *basic-container
    environment:
      - SYSTEM_PARAM_1=80
      - SYSTEM_PARAM_2=UP
      - REPORT_FILE_DIR=/home/report
      - REPORT_FILE_NAME=pump-15m-UP-80.csv

  crypto-bot-surfer-8:
