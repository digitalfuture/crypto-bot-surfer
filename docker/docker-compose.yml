# docker-compose.yml

# Basic service template
x-template: &basic-container
  image: node:20
  volumes:
    - /home/report:/home/report
  env_file: .env
  working_dir: /home
  command:
    - bash
    - -c
    - |
      rm -rf crypto-bot-surfer && \
      git clone --branch signal-trading https://github.com/digitalfuture/crypto-bot-surfer.git && \
      cd crypto-bot-surfer && \
      npm install && \
      npm run nodemon

# Creating containers
services:
  # # # # # # # # # # # # # # # # # # # # # # # # # # #

  pump--5m-fast-1:
    container_name: crypto-bot-surfer-1
    <<: *basic-container
    environment:
      - INDICATOR=pump
      - HEARTBEAT_INTERVAL=5m
      - NEXT_TRADE_DELAY=01m
      - REPORT_FILE_DIR=/home/report
      - REPORT_FILE_NAME=pump-fast-05m-1.csv

  pump--5m-fast-2:
    container_name: crypto-bot-surfer-2
    <<: *basic-container
    environment:
      - INDICATOR=pump
      - HEARTBEAT_INTERVAL=5m
      - NEXT_TRADE_DELAY=02m
      - REPORT_FILE_DIR=/home/report
      - REPORT_FILE_NAME=pump-fast-05m-2.csv

  pump--5m-fast-3:
    container_name: crypto-bot-surfer-3
    <<: *basic-container
    environment:
      - INDICATOR=pump
      - HEARTBEAT_INTERVAL=05m
      - NEXT_TRADE_DELAY=03m
      - REPORT_FILE_DIR=/home/report
      - REPORT_FILE_NAME=pump-fast-05m-3.csv

  pump--5m-fast-4:
    container_name: crypto-bot-surfer-4
    <<: *basic-container
    environment:
      - INDICATOR=pump
      - HEARTBEAT_INTERVAL=05m
      - NEXT_TRADE_DELAY=04m
      - REPORT_FILE_DIR=/home/report
      - REPORT_FILE_NAME=pump-fast-05m-4.csv

  pump--5m-slow-1:
    container_name: crypto-bot-surfer-5
    <<: *basic-container
    environment:
      - INDICATOR=pump
      - HEARTBEAT_INTERVAL=5m
      - NEXT_TRADE_DELAY=06m
      - REPORT_FILE_DIR=/home/report
      - REPORT_FILE_NAME=pump-slow-05m-5.csv

  pump--5m-slow-2:
    container_name: crypto-bot-surfer-6
    <<: *basic-container
    environment:
      - INDICATOR=pump
      - HEARTBEAT_INTERVAL=5m
      - NEXT_TRADE_DELAY=07m
      - REPORT_FILE_DIR=/home/report
      - REPORT_FILE_NAME=pump-slow-05m-6.csv

  pump--5m-slow-3:
    container_name: crypto-bot-surfer-7
    <<: *basic-container
    environment:
      - INDICATOR=pump
      - HEARTBEAT_INTERVAL=05m
      - NEXT_TRADE_DELAY=08m
      - REPORT_FILE_DIR=/home/report
      - REPORT_FILE_NAME=pump-slow-05m-7.csv

  pump--5m-slow-4:
    container_name: crypto-bot-surfer-8
    <<: *basic-container
    environment:
      - INDICATOR=pump
      - HEARTBEAT_INTERVAL=05m
      - NEXT_TRADE_DELAY=09m
      - REPORT_FILE_DIR=/home/report
      - REPORT_FILE_NAME=pump-slow-05m-8.csv
