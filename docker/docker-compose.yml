# docker-compose.yml

# Basic service template
x-template: &basic-container
  image: node:20
  volumes:
    - /home/report:/home/report
  env_file: .env
  working_dir: /home
  command:
    - bash
    - -c
    - |
      rm -rf crypto-bot-surfer && \
      git clone --branch signal-trading https://github.com/digitalfuture/crypto-bot-surfer.git && \
      cd crypto-bot-surfer && \
      npm install && \
      npm run nodemon

services:
  # # # # # # # # # # # # # # # # # # # # # # # # # # #

  crypto-bot-surfer-1:
    container_name: crypto-bot-surfer-1
    <<: *basic-container
    environment:
      - SYSTEM_PARAM_3=0
      - REPORT_FILE_DIR=/home/report
      - REPORT_FILE_NAME=pump-1m-1.csv

  crypto-bot-surfer-2:
    container_name: crypto-bot-surfer-2
    <<: *basic-container
    environment:
      - SYSTEM_PARAM_3=1
      - REPORT_FILE_DIR=/home/report
      - REPORT_FILE_NAME=pump-1m-2.csv

  crypto-bot-surfer-3:
    container_name: crypto-bot-surfer-3
    <<: *basic-container
    environment:
      - SYSTEM_PARAM_3=2
      - REPORT_FILE_DIR=/home/report
      - REPORT_FILE_NAME=pump-1m-3.csv

  crypto-bot-surfer-4:
    container_name: crypto-bot-surfer-4
    <<: *basic-container
    environment:
